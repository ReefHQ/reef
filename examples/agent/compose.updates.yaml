# Optional, one-time setup for updates initiated from central Reef.
# Keep this service image independent of REEF_AGENT_IMAGE: it must survive updates.
services:
  reef-agent:
    environment:
      REEF_AGENT_UPDATE_DIR: /var/lib/reef-agent-updates
    volumes:
      - agent-updates:/var/lib/reef-agent-updates
  agent-updater:
    network_mode: none
    image: ${REEF_AGENT_UPDATER_IMAGE:?Set the published update worker image}
    restart: unless-stopped
    command: [-update-worker, -update-dir, /var/lib/reef-agent-updates]
    environment:
      REEF_INSTALLATION_DIR: ${REEF_AGENT_INSTALLATION_DIR:?Run prepare-agent.sh}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - agent-updates:/var/lib/reef-agent-updates
      - type: bind
        source: ${REEF_AGENT_INSTALLATION_DIR}
        target: ${REEF_AGENT_INSTALLATION_DIR}
        bind:
          create_host_path: false
      - type: bind
        source: ${REEF_AGENT_DOCKER_CONFIG_DIR:?Set the host Docker login folder}
        target: /root/.docker
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    labels:
      traefik.enable: 'false'
      io.reef.instance: 'true'
volumes:
  agent-updates:
