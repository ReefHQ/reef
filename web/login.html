<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Name}}</title><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/style.css"></head><body class="login"><main class="login-card"><div class="login-theme"><div class="theme-control" role="group" aria-label="Color theme"><button type="button" data-theme-choice="system" aria-pressed="true" title="Follow your system theme">System</button><button type="button" data-theme-choice="light" aria-pressed="false" title="Use the light theme">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false" title="Use the dark theme">Dark</button></div></div><span class="eyebrow">YOUR FOLDERS · YOUR PROJECTS</span><h1>{{.Name}}</h1><p>Your Compose projects, made simple.</p><form method="post" action="/login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="{{.Username}}" maxlength="64" required autofocus><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required{{if .Error}} aria-invalid="true" aria-describedby="login-error"{{end}}>{{if .Error}}<p id="login-error" class="field-error" role="alert">{{.Error}}</p>{{end}}<label class="login-remember" for="remember"><input id="remember" name="remember" type="checkbox" value="true"{{if .Remember}} checked{{end}}>Remember me for 30 days</label><button type="submit" class="primary">Open Reef →</button></form><small>12 hours by default · 30 days with Remember me</small></main></body></html>
